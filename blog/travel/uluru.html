<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uluru — meghabytes</title>
  <meta name="description" content="50 photographs from Uluru, Australia.">
  <meta name="author" content="Megha Srivastava">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1F1210;
      --bg-warm: #2D1B16;
      --color-title: #E8D5C4;
      --color-subtitle: #A08878;
      --color-nav: #A08878;
      --color-nav-accent: #C4A882;
      --shadow-photo: 0 8px 40px rgba(0,0,0,0.5);
      --shadow-photo-hover: 0 16px 60px rgba(0,0,0,0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scrollbar-color: #5A3A2A #1F1210;
    }

    body {
      background: var(--bg-deep);
      color: var(--color-title);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor: crosshair;
    }

    /* ── Grain overlay ── */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Header ── */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 2rem;
      z-index: 100;
      mix-blend-mode: difference;
    }
    .site-header nav {
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-nav);
    }
    .site-header nav a {
      color: var(--color-nav-accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* ── Hero ── */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero h1 {
      font-family: 'Lora', Georgia, serif;
      font-weight: 400;
      font-size: clamp(4rem, 12vw, 9rem);
      letter-spacing: 0.08em;
      color: var(--color-title);
      line-height: 1;
      text-transform: uppercase;
    }

    .hero .location {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-subtitle);
      margin-top: 1rem;
    }

    .hero .scroll-hint {
      position: absolute;
      bottom: 3rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-subtitle);
      opacity: 0.6;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 0.7; transform: translateY(4px); }
    }

    /* ── Scatter Gallery ── */
    .gallery {
      position: relative;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem 6rem;
    }

    .scatter-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: -2rem;
      position: relative;
    }

    .photo-item {
      position: relative;
      flex-shrink: 0;
      perspective: 800px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .photo-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-item .frame {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      box-shadow: var(--shadow-photo);
      transition: box-shadow 0.4s ease, transform 0.3s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .photo-item:hover .frame {
      box-shadow: var(--shadow-photo-hover);
      z-index: 10;
    }

    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Size classes ── */
    .photo-item.xl .frame  { width: 480px; height: 360px; }
    .photo-item.lg .frame  { width: 380px; height: 285px; }
    .photo-item.md .frame  { width: 300px; height: 225px; }
    .photo-item.sm .frame  { width: 220px; height: 165px; }
    .photo-item.tall .frame { width: 260px; height: 390px; }
    .photo-item.wide .frame { width: 500px; height: 250px; }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 10, 8, 0.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .lightbox.active {
      display: flex;
      opacity: 1;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.6);
    }

    /* ── Footer ── */
    .site-footer {
      text-align: center;
      padding: 4rem 2rem;
      font-size: 0.82rem;
      color: var(--color-subtitle);
    }
    .site-footer a {
      color: var(--color-nav-accent);
      text-decoration: none;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .photo-item.xl .frame  { width: 320px; height: 240px; }
      .photo-item.lg .frame  { width: 260px; height: 195px; }
      .photo-item.md .frame  { width: 200px; height: 150px; }
      .photo-item.sm .frame  { width: 160px; height: 120px; }
      .photo-item.tall .frame { width: 180px; height: 270px; }
      .photo-item.wide .frame { width: 340px; height: 170px; }
    }

    @media (max-width: 600px) {
      .scatter-row { flex-wrap: wrap; justify-content: center; }
      .photo-item.xl .frame  { width: 90vw; height: 67vw; }
      .photo-item.lg .frame  { width: 75vw; height: 56vw; }
      .photo-item.md .frame  { width: 60vw; height: 45vw; }
      .photo-item.sm .frame  { width: 50vw; height: 37vw; }
      .photo-item.tall .frame { width: 55vw; height: 82vw; }
      .photo-item.wide .frame { width: 85vw; height: 42vw; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav><a href="/">meghabytes</a> · travel</nav>
  </header>

  <section class="hero">
    <h1>Uluṟu-Kata Tjuṯa</h1>
    <p class="location">Northern Territory, Australia · March 2025</p>
    <p class="scroll-hint">scroll ↓</p>
  </section>

  <section class="gallery" id="gallery"></section>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="Full size photo">
  </div>

  <footer class="site-footer">
    <p><a href="/">meghabytes</a></p>
  </footer>

  <script>
    // ── Photo layout data ──
    // Each row is an array of { img, size, rotate, offsetY, marginLeft }
    // Sizes: xl, lg, md, sm, tall, wide
    const rows = [
      // Row 1 — opening spread
      [
        { img: 'images/uluru/01.jpg', size: 'wide', rotate: -1.5, offsetY: 0, marginLeft: 0 },
        { img: 'images/uluru/02.jpg', size: 'md',   rotate: 2,    offsetY: 40, marginLeft: -30 },
      ],
      // Row 2
      [
        { img: 'images/uluru/03.jpg', size: 'sm',   rotate: -2,   offsetY: 20, marginLeft: 40 },
        { img: 'images/uluru/04.jpg', size: 'xl',   rotate: 0.8,  offsetY: -10, marginLeft: -20 },
        { img: 'images/uluru/05.jpg', size: 'sm',   rotate: 3,    offsetY: 60, marginLeft: -25 },
      ],
      // Row 3
      [
        { img: 'images/uluru/06.jpg', size: 'tall', rotate: -1,   offsetY: 0, marginLeft: 20 },
        { img: 'images/uluru/07.jpg', size: 'lg',   rotate: 1.5,  offsetY: 30, marginLeft: -40 },
        { img: 'images/uluru/08.jpg', size: 'md',   rotate: -2.5, offsetY: -20, marginLeft: -15 },
      ],
      // Row 4
      [
        { img: 'images/uluru/09.jpg', size: 'lg',   rotate: 2,    offsetY: 10, marginLeft: 0 },
        { img: 'images/uluru/10.jpg', size: 'sm',   rotate: -3,   offsetY: 50, marginLeft: -35 },
        { img: 'images/uluru/11.jpg', size: 'md',   rotate: 1,    offsetY: -15, marginLeft: -20 },
      ],
      // Row 5 — big moment
      [
        { img: 'images/uluru/12.jpg', size: 'xl',   rotate: -0.5, offsetY: 0, marginLeft: 0 },
        { img: 'images/uluru/13.jpg', size: 'tall', rotate: 2,    offsetY: -30, marginLeft: -50 },
      ],
      // Row 6
      [
        { img: 'images/uluru/14.jpg', size: 'md',   rotate: 3,    offsetY: 25, marginLeft: 60 },
        { img: 'images/uluru/15.jpg', size: 'lg',   rotate: -1.5, offsetY: -10, marginLeft: -20 },
        { img: 'images/uluru/16.jpg', size: 'sm',   rotate: 2,    offsetY: 45, marginLeft: -30 },
      ],
      // Row 7
      [
        { img: 'images/uluru/17.jpg', size: 'sm',   rotate: -2,   offsetY: 30, marginLeft: 30 },
        { img: 'images/uluru/18.jpg', size: 'wide', rotate: 0.5,  offsetY: 0, marginLeft: -25 },
      ],
      // Row 8
      [
        { img: 'images/uluru/19.jpg', size: 'lg',   rotate: 1.5,  offsetY: 15, marginLeft: 0 },
        { img: 'images/uluru/20.jpg', size: 'md',   rotate: -2,   offsetY: -25, marginLeft: -40 },
        { img: 'images/uluru/21.jpg', size: 'tall', rotate: 1,    offsetY: 10, marginLeft: -15 },
      ],
      // Row 9
      [
        { img: 'images/uluru/22.jpg', size: 'md',   rotate: -1.5, offsetY: 0, marginLeft: 40 },
        { img: 'images/uluru/23.jpg', size: 'xl',   rotate: 1,    offsetY: 20, marginLeft: -30 },
      ],
      // Row 10
      [
        { img: 'images/uluru/24.jpg', size: 'sm',   rotate: 3,    offsetY: 40, marginLeft: 80 },
        { img: 'images/uluru/25.jpg', size: 'lg',   rotate: -1,   offsetY: -10, marginLeft: -35 },
        { img: 'images/uluru/26.jpg', size: 'md',   rotate: 2.5,  offsetY: 30, marginLeft: -20 },
      ],
      // Row 11
      [
        { img: 'images/uluru/27.jpg', size: 'wide', rotate: -0.8, offsetY: 0, marginLeft: 0 },
        { img: 'images/uluru/28.jpg', size: 'sm',   rotate: 2,    offsetY: 50, marginLeft: -40 },
      ],
      // Row 12
      [
        { img: 'images/uluru/29.jpg', size: 'tall', rotate: -2,   offsetY: 10, marginLeft: 50 },
        { img: 'images/uluru/30.jpg', size: 'md',   rotate: 1.5,  offsetY: -20, marginLeft: -30 },
        { img: 'images/uluru/31.jpg', size: 'lg',   rotate: -1,   offsetY: 25, marginLeft: -25 },
      ],
      // Row 13
      [
        { img: 'images/uluru/32.jpg', size: 'lg',   rotate: 0.5,  offsetY: 0, marginLeft: 20 },
        { img: 'images/uluru/33.jpg', size: 'sm',   rotate: -3,   offsetY: 60, marginLeft: -20 },
        { img: 'images/uluru/34.jpg', size: 'md',   rotate: 2,    offsetY: -10, marginLeft: -35 },
      ],
      // Row 14 — another big moment
      [
        { img: 'images/uluru/35.jpg', size: 'xl',   rotate: 1,    offsetY: 0, marginLeft: 0 },
      ],
      // Row 15
      [
        { img: 'images/uluru/36.jpg', size: 'md',   rotate: -2,   offsetY: 20, marginLeft: 30 },
        { img: 'images/uluru/37.jpg', size: 'tall', rotate: 1.5,  offsetY: -15, marginLeft: -25 },
        { img: 'images/uluru/38.jpg', size: 'sm',   rotate: -1,   offsetY: 45, marginLeft: -30 },
      ],
      // Row 16
      [
        { img: 'images/uluru/39.jpg', size: 'lg',   rotate: 2,    offsetY: 10, marginLeft: 0 },
        { img: 'images/uluru/40.jpg', size: 'md',   rotate: -1.5, offsetY: -20, marginLeft: -40 },
      ],
      // Row 17
      [
        { img: 'images/uluru/41.jpg', size: 'sm',   rotate: 3,    offsetY: 30, marginLeft: 60 },
        { img: 'images/uluru/42.jpg', size: 'wide', rotate: -0.5, offsetY: 0, marginLeft: -30 },
      ],
      // Row 18
      [
        { img: 'images/uluru/43.jpg', size: 'md',   rotate: 1.5,  offsetY: 15, marginLeft: 40 },
        { img: 'images/uluru/44.jpg', size: 'lg',   rotate: -2,   offsetY: -10, marginLeft: -20 },
        { img: 'images/uluru/45.jpg', size: 'sm',   rotate: 2.5,  offsetY: 50, marginLeft: -25 },
      ],
      // Row 19
      [
        { img: 'images/uluru/46.jpg', size: 'tall', rotate: -1,   offsetY: 0, marginLeft: 0 },
        { img: 'images/uluru/47.jpg', size: 'xl',   rotate: 0.8,  offsetY: 20, marginLeft: -50 },
      ],
      // Row 20 — closing
      [
        { img: 'images/uluru/48.jpg', size: 'sm',   rotate: 2,    offsetY: 30, marginLeft: 70 },
        { img: 'images/uluru/49.jpg', size: 'md',   rotate: -1.5, offsetY: -10, marginLeft: -25 },
        { img: 'images/uluru/50.jpg', size: 'lg',   rotate: 1,    offsetY: 15, marginLeft: -30 },
      ],
    ];

    // ── Build the gallery ──
    const gallery = document.getElementById('gallery');

    rows.forEach((row, rowIdx) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'scatter-row';
      rowEl.style.marginBottom = '-1.5rem';

      row.forEach((photo, i) => {
        const item = document.createElement('div');
        item.className = `photo-item ${photo.size}`;
        item.style.transform = `translateY(${photo.offsetY}px) rotate(${photo.rotate}deg)`;
        item.style.marginLeft = `${photo.marginLeft}px`;
        item.style.zIndex = Math.floor(Math.random() * 5);
        // Stagger animation
        item.style.transitionDelay = `${rowIdx * 0.05 + i * 0.1}s`;

        const frame = document.createElement('div');
        frame.className = 'frame';

        const img = document.createElement('img');
        img.src = `${photo.img}`;
        img.alt = `Uluru photograph ${photo.img.replace('.jpg','')}`;
        img.loading = 'lazy';

        frame.appendChild(img);
        item.appendChild(frame);
        rowEl.appendChild(item);

        // Lightbox click
        frame.addEventListener('click', () => {
          const lb = document.getElementById('lightbox');
          document.getElementById('lightbox-img').src = img.src;
          lb.classList.add('active');
        });
      });

      gallery.appendChild(rowEl);
    });

    // ── Lightbox close ──
    document.getElementById('lightbox').addEventListener('click', function() {
      this.classList.remove('active');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
    });

    // ── Scroll reveal ──
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.photo-item').forEach(el => observer.observe(el));

    // ── Cursor-reactive tilt ──
    let mouseX = 0, mouseY = 0;
    let ticking = false;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!ticking) {
        requestAnimationFrame(applyTilt);
        ticking = true;
      }
    });

    function applyTilt() {
      const frames = document.querySelectorAll('.photo-item .frame');
      const scrollY = window.scrollY;

      frames.forEach(frame => {
        const rect = frame.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = mouseX - centerX;
        const dy = mouseY - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const maxDist = 400;
        if (dist < maxDist) {
          const intensity = 1 - (dist / maxDist);
          const tiltX = (dy / maxDist) * 8 * intensity;  // rotate around X axis
          const tiltY = -(dx / maxDist) * 8 * intensity; // rotate around Y axis
          const lift = intensity * 6;

          frame.style.transform = `perspective(800px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(${lift}px)`;
        } else {
          frame.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
        }
      });

      ticking = false;
    }

    // Reset tilt when mouse leaves
    document.addEventListener('mouseleave', () => {
      document.querySelectorAll('.photo-item .frame').forEach(frame => {
        frame.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
      });
    });
  </script>

</body>
</html>
